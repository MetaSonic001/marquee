[project]
name = "marquee-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "groq>=0.11",
  "mcp>=1.2",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "tenacity>=9.0",
  "pymupdf>=1.24",
  "pillow>=10.4",
  "trafilatura>=1.12",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "psutil>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "reportlab>=4.2"]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
